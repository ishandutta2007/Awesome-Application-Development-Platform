<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
    .card-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .card-meta {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #38bdf8;
    }

    @keyframes orbFloat1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -25px) scale(1.15); }
    }
    @keyframes orbFloat2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-35px, 30px) scale(0.9); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseData {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-orb-1 { animation: orbFloat1 10s ease-in-out infinite; }
    .animated-orb-2 { animation: orbFloat2 12s ease-in-out infinite; }
    .animated-pulse { animation: pulseGlow 4s ease-in-out infinite; }
    .animated-card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .animated-card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .animated-line {
      stroke-dasharray: 8, 8;
      animation: pulseData 15s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Orbs in Background -->
  <g class="animated-orb-1">
    <circle cx="250" cy="120" r="140" fill="#6366f1" opacity="0.22" filter="url(#softGlow)" />
  </g>
  <g class="animated-orb-2">
    <circle cx="950" cy="220" r="160" fill="#0ea5e9" opacity="0.25" filter="url(#softGlow)" />
  </g>
  <circle cx="600" cy="380" r="180" fill="#a855f7" opacity="0.16" filter="url(#softGlow)" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Flow / Network Connections (Dynamic Background Graphic) -->
  <g opacity="0.6">
    <path class="animated-line" d="M 850 130 C 930 130, 930 210, 1010 210" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="animated-line" d="M 850 290 C 930 290, 930 210, 1010 210" fill="none" stroke="#0ea5e9" stroke-width="2.5" />
    <path class="animated-line" d="M 1010 210 C 1070 210, 1080 150, 1140 150" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="animated-line" d="M 1010 210 C 1070 210, 1080 270, 1140 270" fill="none" stroke="#2dd4bf" stroke-width="2" />
  </g>

  <!-- Floating Architecture Cards (Right Side) -->
  <g class="animated-card-1" transform="translate(800, 80)">
    <rect width="190" height="90" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
    <circle cx="30" cy="35" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <text x="30" y="40" font-size="14" text-anchor="middle" fill="#38bdf8">⚡</text>
    <text x="56" y="34" class="card-title">Enterprise SaaS</text>
    <text x="56" y="52" class="card-meta">LCAP &amp; Automation</text>
    <rect x="20" y="65" width="150" height="5" rx="2.5" fill="#334155" />
    <rect x="20" y="65" width="110" height="5" rx="2.5" fill="#38bdf8" />
  </g>

  <g class="animated-card-2" transform="translate(800, 240)">
    <rect width="190" height="90" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
    <circle cx="30" cy="35" r="14" fill="#a855f7" fill-opacity="0.2" />
    <text x="30" y="40" font-size="14" text-anchor="middle" fill="#c084fc">🔓</text>
    <text x="56" y="34" class="card-title">Open Source</text>
    <text x="56" y="52" class="card-meta">Self-Hosted Stacks</text>
    <rect x="20" y="65" width="150" height="5" rx="2.5" fill="#334155" />
    <rect x="20" y="65" width="135" height="5" rx="2.5" fill="#a855f7" />
  </g>

  <g transform="translate(1005, 170)">
    <rect width="150" height="75" rx="12" fill="url(#cardGrad)" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="28" cy="30" r="12" fill="#2dd4bf" fill-opacity="0.2" />
    <text x="28" y="35" font-size="12" text-anchor="middle" fill="#2dd4bf">🚀</text>
    <text x="50" y="32" class="card-title" font-size="13">Agentic AI</text>
    <text x="50" y="48" class="card-meta" font-size="11" fill="#94a3b8">App Engines</text>
  </g>

  <!-- FOREGROUND TEXT SECTION (Clear, prominent, crisp typography) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Tag -->
    <g>
      <rect width="215" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <circle cx="16" cy="17" r="5" fill="#38bdf8" class="animated-pulse" />
      <text x="30" y="22" class="badge-text" fill="#cbd5e1">APPLICATION PLATFORMS</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <g transform="translate(0, 68)">
      <text class="title-text" fill="url(#primaryGrad)">Awesome Application</text>
      <text y="48" class="title-text" fill="#f8fafc">Development Platform 🚀</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 185)">
      <text class="subtitle-text">
        <tspan x="0" dy="0">Curated landscape of low-code, no-code, and developer platforms.</tspan>
        <tspan x="0" dy="28">Complete with enterprise valuations, specific tier pricing, and OSS star counts.</tspan>
      </text>
    </g>

    <!-- Highlighted Feature Badges -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <rect width="125" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="62" y="20" class="badge-text" text-anchor="middle" fill="#38bdf8">🏢 Enterprise SaaS</text>

      <!-- Pill 2 -->
      <rect x="135" width="120" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="195" y="20" class="badge-text" text-anchor="middle" fill="#c084fc">⭐ Open Source</text>

      <!-- Pill 3 -->
      <rect x="265" width="130" height="32" rx="16" fill="#1e293b" stroke="#2dd4bf" stroke-width="1" />
      <text x="330" y="20" class="badge-text" text-anchor="middle" fill="#2dd4bf">💰 Pricing &amp; Tiers</text>

      <!-- Pill 4 -->
      <rect x="405" width="130" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="470" y="20" class="badge-text" text-anchor="middle" fill="#fbbf24">📊 Market Dynamics</text>
    </g>
  </g>

  <!-- Sleek Border Framing -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />
</svg>
